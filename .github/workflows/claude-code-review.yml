name: Claude Code Review

# Automatische code review door Claude op elke PR.
# Auth via Claude Pro/Max abonnement (OAuth-token), niet via API-key.
# Secret CLAUDE_CODE_OAUTH_TOKEN moet als repository secret (Actions) staan.

on:
  pull_request:
    types: [opened, synchronize]

# Voorkom dubbele/parallelle reviews op snelle opeenvolgende pushes.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as an experienced engineer.
            The PR branch is already checked out in the working directory.

            Focus on:
            - Correctness and bugs (edge cases, error handling, async/concurrency)
            - Security (auth, secrets, input validation, injection; for IaC/Lambda
              check IAM least-privilege and resource scoping)
            - Types and schema validation at I/O boundaries
            - Clear, high-signal failure modes
            - Unnecessary complexity or duplication

            Add inline comments on specific lines; use a top-level comment for
            general observations. Write in English. No emoji. Do not merge the
            PR and do not push changes; review only.
          # Kostenbeheersing (--max-turns) + tools om comments te kunnen plaatsen.
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
